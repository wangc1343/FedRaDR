[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fedradr"
version = "0.1.0"
description = "FedRaDR experiments built on the official FedDC framework"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "torchvision>=0.16"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
